<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Surveillance Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: sans-serif; background:#1a1a1a; color:#eee; }

    .navbar {
      background:#111; padding:16px 24px;
      display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px solid #333;
    }
    .navbar h1 { font-size:18px; color:#fff; }
    .navbar button {
      background:#e74c3c; color:#fff; border:none;
      padding:8px 16px; border-radius:6px; cursor:pointer;
    }

    .container { padding:24px; }

    .cards {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
      gap:16px; margin-bottom:24px;
    }
    .card {
      background:#2a2a2a; border-radius:10px;
      padding:20px; text-align:center;
      border:1px solid #333;
    }
    .card h2 { font-size:32px; color:#3498db; }
    .card p  { font-size:13px; color:#aaa; margin-top:6px; }

    .section { margin-bottom:32px; }
    .section h3 {
      font-size:16px; margin-bottom:12px;
      color:#fff; border-left:3px solid #3498db;
      padding-left:10px;
    }

    table {
      width:100%; border-collapse:collapse;
      background:#2a2a2a; border-radius:10px;
      overflow:hidden;
    }
    th {
      background:#111; padding:12px 16px;
      text-align:left; font-size:13px; color:#aaa;
    }
    td {
      padding:12px 16px; font-size:13px;
      border-bottom:1px solid #333;
    }
    tr:last-child td { border-bottom:none; }

    .badge {
      padding:4px 10px; border-radius:20px;
      font-size:11px; font-weight:bold;
    }
    .badge.intruder { background:#e74c3c22; color:#e74c3c; }
    .badge.face     { background:#2ecc7122; color:#2ecc71; }
    .badge.object   { background:#f39c1222; color:#f39c12; }

    .btn {
      padding:8px 16px; border-radius:6px;
      border:none; cursor:pointer; font-size:13px;
    }
    .btn-blue  { background:#3498db; color:#fff; }
    .btn-green { background:#2ecc71; color:#fff; }
    .btn-red   { background:#e74c3c; color:#fff; }

    #login-screen {
      display:flex; justify-content:center;
      align-items:center; height:100vh;
      background:#1a1a1a;
    }
    .login-box {
      background:#2a2a2a; padding:40px;
      border-radius:12px; width:360px;
      border:1px solid #333;
    }
    .login-box h2 { margin-bottom:24px; text-align:center; }
    .login-box input {
      width:100%; padding:10px 14px;
      margin-bottom:14px; border-radius:6px;
      border:1px solid #444; background:#1a1a1a;
      color:#eee; font-size:14px;
    }
    .login-box button {
      width:100%; padding:12px;
      background:#3498db; color:#fff;
      border:none; border-radius:6px;
      cursor:pointer; font-size:15px;
    }
    #error-msg { color:#e74c3c; font-size:13px; margin-top:8px; text-align:center; }
    #dashboard { display:none; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h2>🔒 Surveillance Login</h2>
    <input type="text"     id="username" placeholder="Username"/>
    <input type="password" id="password" placeholder="Password"/>
    <button onclick="login()">Login</button>
    <p id="error-msg"></p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="navbar">
    <h1>🎥 Smart Surveillance</h1>
    <div style="display:flex;gap:10px;align-items:center;">
      <span id="user-label" style="color:#aaa;font-size:13px;"></span>
      <button onclick="generateReport()">📄 Report</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <!-- Stats -->
    <div class="cards">
      <div class="card">
        <h2 id="total-count">0</h2>
        <p>Total Detections</p>
      </div>
      <div class="card">
        <h2 id="intruder-count" style="color:#e74c3c;">0</h2>
        <p>Intruder Alerts</p>
      </div>
      <div class="card">
        <h2 id="face-count" style="color:#2ecc71;">0</h2>
        <p>Known Faces</p>
      </div>
    </div>

    <!-- Detection Logs -->
    <div class="section">
      <h3>Detection Logs</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Camera</th>
            <th>Type</th>
            <th>Label</th>
            <th>Timestamp</th>
            <th>Snapshot</th>
          </tr>
        </thead>
        <tbody id="detections-table"></tbody>
      </table>
    </div>

    <!-- Known Faces -->
    <div class="section">
      <h3>Known Faces</h3>
      <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;">
        <input type="text" id="face-name" placeholder="Person name"
          style="padding:8px 12px;border-radius:6px;border:1px solid #444;
                 background:#1a1a1a;color:#eee;font-size:13px;"/>
        <input type="file" id="face-file" accept="image/*"
          style="font-size:13px;color:#aaa;"/>
        <button class="btn btn-green" onclick="registerFace()">Register Face</button>
      </div>
      <div id="known-faces-list" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
    </div>
  </div>
</div>

<script>
  const API = "http://localhost:8000"
  let token = localStorage.getItem("token") || ""

  async function login() {
    const username = document.getElementById("username").value
    const password = document.getElementById("password").value
    const form     = new URLSearchParams()
    form.append("username", username)
    form.append("password", password)

    const res = await fetch(`${API}/auth/login`, {
      method : "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body   : form
    })
    if (res.ok) {
      const data = await res.json()
      token = data.access_token
      localStorage.setItem("token", token)
      showDashboard()
    } else {
      document.getElementById("error-msg").textContent = "Invalid credentials"
    }
  }

  function logout() {
    localStorage.removeItem("token")
    token = ""
    document.getElementById("login-screen").style.display = "flex"
    document.getElementById("dashboard").style.display    = "none"
  }

  async function showDashboard() {
    document.getElementById("login-screen").style.display = "none"
    document.getElementById("dashboard").style.display    = "block"
    const me = await fetch(`${API}/auth/me`, {
      headers: { Authorization: `Bearer ${token}` }
    }).then(r => r.json())
    document.getElementById("user-label").textContent = `👤 ${me.username} (${me.role})`
    loadDetections()
    loadKnownFaces()
  }

  async function loadDetections() {
    const res  = await fetch(`${API}/detections/`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    const tbody = document.getElementById("detections-table")
    tbody.innerHTML = ""
    let intruders = 0
    data.forEach(d => {
      if (d.type === "intruder") intruders++
      const snap = d.snapshot_path
        ? `<a href="${API}/detections/snapshot/${d.snapshot_path.split(/[\\/]/).pop()}"
              target="_blank" style="color:#3498db;">View</a>`
        : "-"
      tbody.innerHTML += `
        <tr>
          <td>${d.id}</td>
          <td>Cam ${d.camera_id}</td>
          <td><span class="badge ${d.type}">${d.type}</span></td>
          <td>${d.label || "-"}</td>
          <td>${d.timestamp}</td>
          <td>${snap}</td>
        </tr>`
    })
    document.getElementById("total-count").textContent    = data.length
    document.getElementById("intruder-count").textContent = intruders
  }

  async function loadKnownFaces() {
    const res  = await fetch(`${API}/detections/known-faces`, {
      headers: { Authorization: `Bearer ${token}` }
    })
    const data = await res.json()
    document.getElementById("face-count").textContent = data.length
    const list = document.getElementById("known-faces-list")
    list.innerHTML = ""
    data.forEach(f => {
      list.innerHTML += `
        <div style="background:#2a2a2a;padding:12px;border-radius:8px;
                    border:1px solid #333;text-align:center;min-width:120px;">
          <p style="font-size:13px;margin-bottom:8px;">${f.name}</p>
          <button class="btn btn-red" style="font-size:11px;padding:4px 10px;"
            onclick="deleteFace('${f.name}')">Remove</button>
        </div>`
    })
  }

  async function registerFace() {
    const name = document.getElementById("face-name").value
    const file = document.getElementById("face-file").files[0]
    if (!name || !file) return alert("Enter name and select image")
    const form = new FormData()
    form.append("name", name)
    form.append("file", file)
    const res = await fetch(`${API}/detections/known-faces`, {
      method : "POST",
      headers: { Authorization: `Bearer ${token}` },
      body   : form
    })
    if (res.ok) { alert("Face registered!"); loadKnownFaces() }
    else alert("Failed to register face")
  }

  async function deleteFace(name) {
    if (!confirm(`Remove ${name}?`)) return
    await fetch(`${API}/detections/known-faces/${name}`, {
      method : "DELETE",
      headers: { Authorization: `Bearer ${token}` }
    })
    loadKnownFaces()
  }

  async function generateReport() {
    window.open(`${API}/reports/generate?token=${token}`, "_blank")
  }

  if (token) showDashboard()
</script>
</body>
</html>
